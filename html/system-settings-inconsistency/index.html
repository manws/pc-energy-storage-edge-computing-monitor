<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 · 不一致性估算设置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-page: #0F1D38;
  --bg-bar: #18294D;
  --bg-card: #243B66;
  --bg-card-active: #17386B;
  --accent: #29B6F6;
  --text-1: #FAFAFA;
  --text-2: #A1A1AA;
  --text-3: #71717A;
  --divider: #2A3F68;
  --divider-2: #27272A;
  --input-bg: #0E0E10;
  --input-border: #3F3F46;
  --green: #4CAF50;
  --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  background: #0A1426;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
.stage {
  width: 1280px;
  height: 800px;
  background: var(--bg-page);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
}

/* ============ Top Bar ============ */
.top-bar {
  height: 56px;
  flex-shrink: 0;
  background: var(--bg-bar);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 24px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { width: 12px; height: 12px; border-radius: 3px; background: var(--accent); }
.brand .brand-name { font-size: 16px; font-weight: 600; color: var(--text-1); }
.nav-tabs { display: flex; gap: 4px; }
.nav-tab {
  padding: 7px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  color: var(--text-2);
  cursor: pointer;
  transition: color .15s ease;
}
.nav-tab:hover { color: var(--text-1); }
.nav-tab.active { background: var(--bg-card); color: var(--text-1); }
.status { display: flex; align-items: center; gap: 8px; }
.status .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green); }
.status .status-text { font-size: 13px; color: var(--text-2); }
.status .status-time { font-family: var(--font-mono); font-size: 13px; color: var(--text-3); }

.divider { height: 1px; flex-shrink: 0; background: var(--divider); }

/* ============ Content ============ */
.content {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 16px;
  padding: 20px;
  min-height: 0;
}
.setting-tabs { display: flex; gap: 8px; flex-shrink: 0; }
.setting-tab {
  padding: 9px 16px;
  border-radius: 8px;
  background: var(--bg-card);
  border: 1px solid transparent;
  font-size: 13px;
  color: var(--text-2);
  cursor: pointer;
  transition: color .15s ease;
}
.setting-tab:hover { color: var(--text-1); }
.setting-tab.active {
  background: var(--bg-card-active);
  border-color: var(--accent);
  color: var(--accent);
}

/* ============ Panel ============ */
.panel {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 24px;
  border-radius: 12px;
  background: var(--bg-bar);
  border: 1px solid var(--divider);
}
.panel-title { display: flex; flex-direction: column; gap: 4px; }
.panel-title .title { font-size: 18px; font-weight: 600; color: var(--text-1); }
.panel-title .subtitle { font-size: 13px; color: var(--text-2); }
.panel-divider { height: 1px; flex-shrink: 0; background: var(--divider-2); }

/* ============ Form ============ */
.form {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 16px;
  align-content: flex-start;
}
.field-card {
  width: 580px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 16px;
  border-radius: 8px;
  background: var(--bg-card);
}
.field-card.fixed { height: 128px; }
.field-card .label { font-size: 14px; font-weight: 500; color: var(--text-1); }
.field-card .hint { font-size: 11px; color: var(--text-3); }
.field-card.slider-card { gap: 12px; }

.input {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 12px;
  border-radius: 6px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
}
.input .value { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--text-1); }
.input .unit { font-size: 12px; color: var(--text-3); }

.dropdown {
  height: 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 10px 0 12px;
  border-radius: 6px;
  background: var(--input-bg);
  border: 1px solid var(--input-border);
  cursor: pointer;
}
.dropdown .value { font-size: 14px; color: var(--text-1); }
.dropdown .chevron { width: 18px; height: 18px; display: block; }

/* ============ Slider ============ */
.slider-row {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
}
.slider-track {
  position: relative;
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: var(--divider-2);
  cursor: pointer;
  touch-action: none;
}
.slider-fill {
  position: absolute;
  left: 0; top: 0;
  height: 6px;
  border-radius: 3px;
  background: var(--accent);
  width: 84.5%;
}
.slider-knob {
  position: absolute;
  top: -4px;
  width: 14px; height: 14px;
  border-radius: 7px;
  background: #FFFFFF;
  left: calc(84.5% - 7px);
  box-shadow: 0 1px 3px rgba(0,0,0,.4);
}
.slider-value { font-family: var(--font-mono); font-size: 15px; font-weight: 500; color: var(--accent); }

/* ============ Footer ============ */
.panel-footer {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  flex-shrink: 0;
}
.btn {
  border-radius: 8px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  font-family: var(--font-sans);
  transition: filter .15s ease, background .15s ease;
}
.btn-secondary {
  padding: 10px 20px;
  background: transparent;
  border: 1px solid var(--input-border);
  color: var(--text-2);
}
.btn-secondary:hover { color: var(--text-1); border-color: var(--text-3); }
.btn-primary {
  padding: 10px 24px;
  background: var(--accent);
  border: none;
  color: var(--input-bg);
}
.btn-primary:hover { filter: brightness(1.1); }
</style>
</head>
<body>
<div class="stage" id="stage">

  <!-- Top Bar -->
  <header class="top-bar">
    <div class="brand">
      <div class="logo"></div>
      <div class="brand-name">储能 · 边缘计算监控系统</div>
    </div>
    <nav class="nav-tabs">
      <div class="nav-tab">实时监控</div>
      <div class="nav-tab">算法估算</div>
      <div class="nav-tab active">系统设置</div>
    </nav>
    <div class="status">
      <div class="dot"></div>
      <div class="status-text">在线</div>
      <div class="status-time">最后更新 14:32:05</div>
    </div>
  </header>

  <div class="divider"></div>

  <!-- Content -->
  <main class="content">
    <div class="setting-tabs">
      <div class="setting-tab">SOC 估算设置</div>
      <div class="setting-tab">SOE 估算设置</div>
      <div class="setting-tab">SOP 估算设置</div>
      <div class="setting-tab active">不一致性估算设置</div>
      <div class="setting-tab">预警估算设置</div>
    </div>

    <section class="panel">
      <div class="panel-title">
        <div class="title">不一致性估算设置</div>
        <div class="subtitle">配置单体一致性检测的采样与算法参数</div>
      </div>
      <div class="panel-divider"></div>

      <div class="form">
        <div class="field-card fixed">
          <div class="label">时间窗（点数）</div>
          <div class="hint">参与一致性估算的采样点数量</div>
          <div class="input">
            <div class="value">60</div>
            <div class="unit">点</div>
          </div>
        </div>

        <div class="field-card fixed">
          <div class="label">采样频率</div>
          <div class="hint">数据采集的时间间隔</div>
          <div class="dropdown">
            <div class="value">1 秒 / 点</div>
            <img class="chevron" src="./assets/svg/220_511-20261008_153421977.svg" alt="">
          </div>
        </div>

        <div class="field-card fixed">
          <div class="label">特征分量数</div>
          <div class="hint">主成分分析保留的特征维度数量</div>
          <div class="input">
            <div class="value">8</div>
            <div class="unit">个</div>
          </div>
        </div>

        <div class="field-card slider-card">
          <div class="label">卡方置信度阈值</div>
          <div class="hint">取值范围 0.5 – 1.0,越高判定越严格</div>
          <div class="slider-row">
            <div class="slider-track" id="sliderTrack">
              <div class="slider-fill" id="sliderFill"></div>
              <div class="slider-knob" id="sliderKnob"></div>
            </div>
            <div class="slider-value" id="sliderValue">0.95</div>
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <button class="btn btn-secondary">重置</button>
        <button class="btn btn-primary">保存设置</button>
      </div>
    </section>
  </main>
</div>

<script>
// 等比缩放：保留原始 1280×800 画布，随窗口等比缩放并居中
(function () {
  var stage = document.getElementById('stage');
  var W = 1280, H = 800;
  function fit() {
    var s = Math.min(window.innerWidth / W, window.innerHeight / H);
    stage.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
})();

// 卡方置信度阈值滑块：0.5 – 1.0 可拖动
(function () {
  var track = document.getElementById('sliderTrack');
  var fill = document.getElementById('sliderFill');
  var knob = document.getElementById('sliderKnob');
  var valueEl = document.getElementById('sliderValue');
  var MIN = 0.5, MAX = 1.0;
  var dragging = false;

  function posToValue(clientX) {
    var r = track.getBoundingClientRect();
    var t = (clientX - r.left) / r.width;
    t = Math.max(0, Math.min(1, t));
    return MIN + t * (MAX - MIN);
  }
  function render(v) {
    var t = (v - MIN) / (MAX - MIN);
    var pct = (t * 100).toFixed(2) + '%';
    fill.style.width = pct;
    knob.style.left = 'calc(' + pct + ' - 7px)';
    valueEl.textContent = v.toFixed(2);
  }
  track.addEventListener('pointerdown', function (e) {
    dragging = true;
    track.setPointerCapture(e.pointerId);
    render(posToValue(e.clientX));
  });
  track.addEventListener('pointermove', function (e) {
    if (dragging) render(posToValue(e.clientX));
  });
  track.addEventListener('pointerup', function () { dragging = false; });
  track.addEventListener('pointercancel', function () { dragging = false; });
})();
</script>
</body>
</html>
