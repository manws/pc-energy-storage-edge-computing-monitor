<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>系统设置 - 预警估算设置</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0F1D38;            /* 页面底色 */
    --bar: #18294D;           /* 顶栏 / 面板 */
    --divider: #2A3F68;       /* 分隔线 / 面板描边 */
    --pill: #243B66;          /* 未激活标签 / 字段卡 */
    --pill-active: #17386B;   /* 激活设置标签底 */
    --input-bg: #0E0E10;      /* 输入框底 */
    --input-border: #3F3F46;  /* 输入框 / 重置按钮描边 */
    --accent: #29B6F6;        /* 主色蓝 */
    --yellow: #F2C94C;        /* 分组圆点 / 阈值数值 */
    --green: #4CAF50;         /* 在线状态点 */
    --text-primary: #FAFAFA;
    --text-secondary: #A1A1AA;
    --text-muted: #71717A;
    --text-label: #E4E4E7;
    --font-sans: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    --font-mono: 'JetBrains Mono', 'SFMono-Regular', Consolas, 'Noto Sans SC', monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    font-family: var(--font-sans);
    line-height: normal;
    -webkit-font-smoothing: antialiased;
  }

  /* 1280×800 原始画布，等比缩放居中 */
  #stage {
    position: absolute;
    width: 1280px;
    height: 800px;
    transform-origin: top left;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    overflow: hidden;
  }

  /* ===== 顶栏 ===== */
  .topbar {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    background: var(--bar);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 12px;
    height: 12px;
    border-radius: 3px;
    background: var(--accent);
  }
  .brand-name { font-size: 16px; font-weight: 600; color: var(--text-primary); }

  .top-tabs { display: flex; gap: 4px; }
  .top-tab {
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    cursor: pointer;
    transition: color .15s ease;
  }
  .top-tab:hover { color: var(--text-primary); }
  .top-tab.active { background: var(--pill); color: var(--text-primary); }

  .status { display: flex; align-items: center; gap: 8px; }
  .status-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--green); }
  .status-text { font-size: 13px; color: var(--text-secondary); }
  .status-time { font-family: var(--font-mono); font-size: 13px; color: var(--text-muted); }

  .topbar-divider { flex: none; height: 1px; background: var(--divider); }

  /* ===== 内容区 ===== */
  .content {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 20px;
  }

  .setting-tabs { display: flex; gap: 8px; }
  .setting-tab {
    padding: 9px 16px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    background: var(--pill);
    cursor: pointer;
    transition: background .15s ease;
  }
  .setting-tab:hover { background: #2C446F; }
  .setting-tab.active {
    background: var(--pill-active);
    border-color: var(--accent);
    color: var(--accent);
    cursor: default;
  }

  .panel {
    flex: 1;
    min-height: 0;
    background: var(--bar);
    border: 1px solid var(--divider);
    border-radius: 12px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .panel-head { display: flex; flex-direction: column; gap: 4px; }
  .panel-title { margin: 0; font-size: 18px; font-weight: 600; color: var(--text-primary); }
  .panel-sub { margin: 0; font-size: 13px; color: var(--text-secondary); }

  .panel-divider { flex: none; height: 1px; background: #27272A; }

  .form {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }
  .group { display: flex; flex-direction: column; gap: 12px; }
  .group-head { display: flex; align-items: center; gap: 8px; }
  .group-dot { width: 8px; height: 8px; border-radius: 4px; background: var(--yellow); }
  .group-title { margin: 0; font-size: 15px; font-weight: 600; color: var(--text-primary); }

  .fields { display: flex; gap: 16px; }
  .field {
    flex: 1;
    background: var(--pill);
    border-radius: 8px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .field-label { font-size: 13px; font-weight: 500; color: var(--text-label); }

  .input {
    height: 38px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px;
  }
  .input-select { padding-right: 10px; }
  .input-value { font-size: 14px; color: var(--text-primary); }
  .input-value.mono { font-family: var(--font-mono); font-weight: 500; }
  .input-value.accent { color: var(--yellow); }
  .input-unit { font-size: 12px; color: var(--text-muted); }
  .chevron { flex: none; display: block; }

  .panel-footer { display: flex; justify-content: flex-end; gap: 12px; }
  .btn {
    border: none;
    border-radius: 8px;
    font-family: var(--font-sans);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: filter .15s ease, background .15s ease;
  }
  .btn-reset {
    padding: 10px 20px;
    background: transparent;
    border: 1px solid var(--input-border);
    color: var(--text-secondary);
  }
  .btn-reset:hover { background: rgba(63, 63, 70, .25); color: var(--text-primary); }
  .btn-save { padding: 10px 24px; background: var(--accent); color: var(--input-bg); }
  .btn-save:hover { filter: brightness(1.08); }
</style>
</head>
<body>
<div id="stage">
  <header class="topbar">
    <div class="brand">
      <div class="brand-logo"></div>
      <span class="brand-name">储能 · 边缘计算监控系统</span>
    </div>
    <nav class="top-tabs">
      <div class="top-tab">实时监控</div>
      <div class="top-tab">算法估算</div>
      <div class="top-tab active">系统设置</div>
    </nav>
    <div class="status">
      <span class="status-dot"></span>
      <span class="status-text">在线</span>
      <span class="status-time">最后更新 14:32:05</span>
    </div>
  </header>

  <div class="topbar-divider"></div>

  <main class="content">
    <nav class="setting-tabs">
      <div class="setting-tab">SOC 估算设置</div>
      <div class="setting-tab">SOE 估算设置</div>
      <div class="setting-tab">SOP 估算设置</div>
      <div class="setting-tab">不一致性估算设置</div>
      <div class="setting-tab active">预警估算设置</div>
    </nav>

    <section class="panel">
      <div class="panel-head">
        <h1 class="panel-title">预警估算设置</h1>
        <p class="panel-sub">配置绝缘电阻与内阻异常的检测与报警参数</p>
      </div>

      <div class="panel-divider"></div>

      <div class="form">
        <section class="group">
          <div class="group-head">
            <span class="group-dot"></span>
            <h2 class="group-title">绝缘电阻异常检测</h2>
          </div>
          <div class="fields">
            <div class="field">
              <label class="field-label">时间窗（点数）</label>
              <div class="input">
                <span class="input-value mono">60</span>
                <span class="input-unit">点</span>
              </div>
            </div>
            <div class="field">
              <label class="field-label">采样频率</label>
              <div class="input input-select">
                <span class="input-value">1 秒 / 点</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#A1A1AA" transform="translate(4 6)" d="M4 2.5858L0.7071 -0.7071Q0.4192 -1.0121 0 -1Q-0.4192 -1.0121 -0.7071 -0.7071Q-1.0121 -0.4192 -1 0Q-1.0121 0.4192 -0.7071 0.7071L3.2929 4.7071Q3.5808 5.0121 4 5Q4.4192 5.0121 4.7071 4.7071L8.7071 0.7071Q9.0121 0.4192 9 0Q9.0121 -0.4192 8.7071 -0.7071Q8.4192 -1.0121 8 -1Q7.5808 -1.0121 7.2929 -0.7071L4 2.5858Z"/>
                </svg>
              </div>
            </div>
            <div class="field">
              <label class="field-label">报警阈值（默认 1.0）</label>
              <div class="input">
                <span class="input-value mono accent">1.0</span>
                <span class="input-unit">MΩ</span>
              </div>
            </div>
          </div>
        </section>

        <section class="group">
          <div class="group-head">
            <span class="group-dot"></span>
            <h2 class="group-title">内阻异常检测</h2>
          </div>
          <div class="fields">
            <div class="field">
              <label class="field-label">时间窗（点数）</label>
              <div class="input">
                <span class="input-value mono">60</span>
                <span class="input-unit">点</span>
              </div>
            </div>
            <div class="field">
              <label class="field-label">采样频率</label>
              <div class="input input-select">
                <span class="input-value">1 秒 / 点</span>
                <svg class="chevron" width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path fill="#A1A1AA" transform="translate(4 6)" d="M4 2.5858L0.7071 -0.7071Q0.4192 -1.0121 0 -1Q-0.4192 -1.0121 -0.7071 -0.7071Q-1.0121 -0.4192 -1 0Q-1.0121 0.4192 -0.7071 0.7071L3.2929 4.7071Q3.5808 5.0121 4 5Q4.4192 5.0121 4.7071 4.7071L8.7071 0.7071Q9.0121 0.4192 9 0Q9.0121 -0.4192 8.7071 -0.7071Q8.4192 -1.0121 8 -1Q7.5808 -1.0121 7.2929 -0.7071L4 2.5858Z"/>
                </svg>
              </div>
            </div>
            <div class="field">
              <label class="field-label">报警阈值（默认 0.7）</label>
              <div class="input">
                <span class="input-value mono accent">0.7</span>
                <span class="input-unit">mΩ</span>
              </div>
            </div>
          </div>
        </section>
      </div>

      <div class="panel-footer">
        <button class="btn btn-reset">重置</button>
        <button class="btn btn-save">保存设置</button>
      </div>
    </section>
  </main>
</div>

<script>
  // 1280×800 设计画布随窗口等比缩放并居中
  (function () {
    var DESIGN_W = 1280, DESIGN_H = 800;
    var stage = document.getElementById('stage');
    function fit() {
      var scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
      stage.style.transform = 'scale(' + scale + ')';
      stage.style.left = ((window.innerWidth - DESIGN_W * scale) / 2) + 'px';
      stage.style.top = ((window.innerHeight - DESIGN_H * scale) / 2) + 'px';
    }
    window.addEventListener('resize', fit);
    fit();
  })();
</script>
</body>
</html>
