<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>储能 · 边缘计算监控系统 — 实时监控</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    /* Surfaces */
    --bg-page:        #0F1D38;
    --bg-surface:     #18294D;
    --bg-elevated:    #243B66;
    --border-line:    #2A3F68;
    --border-btn:     #3C5486;
    --divider-card:   #27272A;

    /* Text */
    --text-primary:   #FAFAFA;
    --text-secondary: #A1A1AA;
    --text-muted:     #71717A;

    /* Semantic */
    --accent:         #29B6F6;
    --ok:             #4CAF50;
    --warn:           #F2C94C;
    --error:          #FF5252;
    --pill-ok:        #182C1A;
    --pill-warn:      #2E2A16;
    --pill-error:     #2E1818;

    /* Radius */
    --r-logo: 3px;
    --r-dot: 4px;
    --r-pill: 6px;
    --r-tab: 8px;
    --r-btn: 8px;
    --r-card: 12px;

    --font-sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    --font-mono: "JetBrains Mono", "SFMono-Regular", Consolas, monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    background: #070D1A;
    overflow: hidden;
  }

  body {
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* ---------- Stage: 原始画布 1280×800 + 等比缩放 ---------- */
  #stage {
    position: absolute;
    top: 0;
    left: 0;
    width: 1280px;
    height: 800px;
    transform-origin: top left;
  }

  .screen {
    width: 1280px;
    height: 800px;
    background: var(--bg-page);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ---------- Top Bar ---------- */
  .top-bar {
    flex: none;
    height: 56px;
    padding: 0 24px;
    background: var(--bg-surface);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 10px;
  }

  .brand .logo {
    width: 12px;
    height: 12px;
    border-radius: var(--r-logo);
    background: var(--accent);
  }

  .brand .system-name {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .tabs {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 4px;
  }

  .tab {
    padding: 7px 14px;
    border-radius: var(--r-tab);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-secondary);
    background: transparent;
    cursor: pointer;
    user-select: none;
    transition: background .18s ease, color .18s ease;
  }

  .tab:hover { color: var(--text-primary); background: rgba(36, 59, 102, .55); }

  .tab.is-active {
    background: var(--bg-elevated);
    color: var(--text-primary);
  }

  .status {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 8px;
  }

  .status .dot {
    width: 8px;
    height: 8px;
    border-radius: var(--r-dot);
    background: var(--ok);
  }

  .status .online {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  .status .updated {
    font-family: var(--font-mono);
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
  }

  .header-divider {
    flex: none;
    height: 1px;
    background: var(--border-line);
  }

  /* ---------- Content ---------- */
  .content {
    flex: 1;
    min-height: 0;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    overflow: hidden;
  }

  .section-header {
    flex: none;
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .titles {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .titles .h {
    font-size: 20px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .titles .sub {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  .legend {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 16px;
  }

  .legend-item {
    display: flex;
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }

  .legend-item .d {
    width: 8px;
    height: 8px;
    border-radius: var(--r-dot);
  }

  .legend-item .d.ok    { background: var(--ok); }
  .legend-item .d.warn  { background: var(--warn); }
  .legend-item .d.error { background: var(--error); }

  .legend-item .t {
    font-size: 12px;
    font-weight: 400;
    color: var(--text-secondary);
  }

  /* ---------- BMS Grid ---------- */
  .bms-grid {
    flex: none;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }

  /* ---------- BMS Card ---------- */
  .bms-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-line);
    border-radius: var(--r-card);
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .card-header {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
  }

  .card-header .title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .status-pill {
    padding: 3px 8px;
    border-radius: var(--r-pill);
    font-size: 12px;
    font-weight: 500;
    line-height: 1.4;
  }

  .status-pill.ok    { background: var(--pill-ok);    color: var(--ok); }
  .status-pill.warn  { background: var(--pill-warn);  color: var(--warn); }
  .status-pill.error { background: var(--pill-error); color: var(--error); }

  .card-divider {
    height: 1px;
    background: var(--divider-card);
  }

  .field-grid {
    display: grid;
    grid-template-columns: repeat(4, 62px);
    gap: 8px;
  }

  .field {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .field .l {
    font-size: 10px;
    font-weight: 400;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .field .v {
    font-family: var(--font-mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    white-space: nowrap;
  }

  .field .v.ok    { color: var(--ok); }
  .field .v.warn  { color: var(--warn); }
  .field .v.error { color: var(--error); }

  .detail-btn {
    height: 32px;
    border: 1px solid var(--border-btn);
    border-radius: var(--r-btn);
    background: var(--bg-elevated);
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--accent);
    cursor: pointer;
    transition: background .18s ease, border-color .18s ease;
  }

  .detail-btn:hover {
    background: #2A4474;
    border-color: #4A639A;
  }
</style>
</head>
<body>

<div id="stage">
  <section class="screen" id="screen">

    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="logo"></span>
        <span class="system-name">储能 · 边缘计算监控系统</span>
      </div>
      <nav class="tabs">
        <span class="tab is-active">实时监控</span>
        <span class="tab">算法估算</span>
        <span class="tab">系统设置</span>
      </nav>
      <div class="status">
        <span class="dot"></span>
        <span class="online">在线</span>
        <span class="updated" id="updated">最后更新 14:32:05</span>
      </div>
    </header>
    <div class="header-divider"></div>

    <!-- Content -->
    <main class="content">
      <div class="section-header">
        <div class="titles">
          <div class="h">实时监控</div>
          <div class="sub">12 组电池簇集群 · 实时运行状态</div>
        </div>
        <div class="legend">
          <div class="legend-item"><span class="d ok"></span><span class="t">正常</span></div>
          <div class="legend-item"><span class="d warn"></span><span class="t">预警</span></div>
          <div class="legend-item"><span class="d error"></span><span class="t">异常</span></div>
        </div>
      </div>

      <div class="bms-grid" id="bmsGrid"></div>
    </main>

  </section>
</div>

<script>
  /* ---------- Data (1:1 with the design) ---------- */
  var BMS_DATA = [
    { title: 'BMS1',  status: '正常', totalV: '712.5 V', totalI: '128.6 A', soc: '86.2 %', cellMax: '3.412 V', cellMin: '3.398 V', tempMax: '32.5 ℃', tempMin: '28.1 ℃' },
    { title: 'BMS2',  status: '正常', totalV: '709.8 V', totalI: '132.1 A', soc: '84.7 %', cellMax: '3.408 V', cellMin: '3.391 V', tempMax: '33.1 ℃', tempMin: '27.9 ℃' },
    { title: 'BMS3',  status: '正常', totalV: '714.2 V', totalI: '119.4 A', soc: '88.0 %', cellMax: '3.415 V', cellMin: '3.402 V', tempMax: '31.8 ℃', tempMin: '28.4 ℃' },
    { title: 'BMS4',  status: '预警', totalV: '705.6 V', totalI: '141.7 A', soc: '79.3 %', cellMax: '3.401 V', cellMin: '3.372 V', tempMax: '35.6 ℃', tempMin: '29.0 ℃' },
    { title: 'BMS5',  status: '正常', totalV: '711.9 V', totalI: '126.3 A', soc: '85.5 %', cellMax: '3.410 V', cellMin: '3.396 V', tempMax: '32.0 ℃', tempMin: '27.6 ℃' },
    { title: 'BMS6',  status: '正常', totalV: '713.4 V', totalI: '122.8 A', soc: '87.1 %', cellMax: '3.413 V', cellMin: '3.400 V', tempMax: '31.5 ℃', tempMin: '28.2 ℃' },
    { title: 'BMS7',  status: '异常', totalV: '698.2 V', totalI: '150.2 A', soc: '72.6 %', cellMax: '3.390 V', cellMin: '3.341 V', tempMax: '38.9 ℃', tempMin: '29.5 ℃' },
    { title: 'BMS8',  status: '正常', totalV: '710.7 V', totalI: '130.5 A', soc: '83.9 %', cellMax: '3.407 V', cellMin: '3.393 V', tempMax: '33.4 ℃', tempMin: '28.0 ℃' },
    { title: 'BMS9',  status: '正常', totalV: '712.1 V', totalI: '127.9 A', soc: '86.0 %', cellMax: '3.411 V', cellMin: '3.397 V', tempMax: '32.3 ℃', tempMin: '27.8 ℃' },
    { title: 'BMS10', status: '预警', totalV: '707.3 V', totalI: '138.4 A', soc: '81.2 %', cellMax: '3.404 V', cellMin: '3.385 V', tempMax: '34.7 ℃', tempMin: '28.8 ℃' },
    { title: 'BMS11', status: '正常', totalV: '714.9 V', totalI: '118.1 A', soc: '88.7 %', cellMax: '3.416 V', cellMin: '3.404 V', tempMax: '31.2 ℃', tempMin: '28.5 ℃' },
    { title: 'BMS12', status: '正常', totalV: '711.2 V', totalI: '129.0 A', soc: '85.0 %', cellMax: '3.409 V', cellMin: '3.395 V', tempMax: '32.8 ℃', tempMin: '27.7 ℃' }
  ];

  var STATUS_TONE = { '正常': 'ok', '预警': 'warn', '异常': 'error' };

  function field(label, value, tone) {
    return '<div class="field">' +
             '<span class="l">' + label + '</span>' +
             '<span class="v' + (tone ? ' ' + tone : '') + '">' + value + '</span>' +
           '</div>';
  }

  function card(d) {
    var tone = STATUS_TONE[d.status] || 'ok';
    return '<article class="bms-card">' +
             '<div class="card-header">' +
               '<span class="title">' + d.title + '</span>' +
               '<span class="status-pill ' + tone + '">' + d.status + '</span>' +
             '</div>' +
             '<div class="card-divider"></div>' +
             '<div class="field-grid">' +
               field('总电压', d.totalV) +
               field('总电流', d.totalI) +
               field('SOC', d.soc, tone) +
               field('最高单体', d.cellMax) +
               field('最低单体', d.cellMin) +
               field('最高温度', d.tempMax) +
               field('最低温度', d.tempMin) +
             '</div>' +
             '<button class="detail-btn" type="button">查看详情</button>' +
           '</article>';
  }

  document.getElementById('bmsGrid').innerHTML = BMS_DATA.map(card).join('');

  /* ---------- 等比缩放：保留 1280×800 原始画布 ---------- */
  var DESIGN_W = 1280, DESIGN_H = 800;
  var stage = document.getElementById('stage');

  function fit() {
    var scale = Math.min(window.innerWidth / DESIGN_W, window.innerHeight / DESIGN_H);
    stage.style.transform =
      'translate(' + ((window.innerWidth  - DESIGN_W * scale) / 2) + 'px,' +
                     ((window.innerHeight - DESIGN_H * scale) / 2) + 'px) ' +
      'scale(' + scale + ')';
  }

  fit();
  window.addEventListener('resize', fit);
</script>

</body>
</html>
